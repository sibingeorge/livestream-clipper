[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.2.0"
description = "Local-first live-stream moment detector and Shorts draft studio (no paid APIs)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "yt-dlp>=2024.8.6"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
